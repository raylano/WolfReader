name: Release

# Push a tag such as v1.1.0 and the Windows installer is built and attached to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - run: npm run verify:package
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/Wolfreader-Setup-*.exe
            release/Wolfreader-Setup-*.exe.blockmap
