name: Release

# Merging to main publishes the version in package.json: the Windows installer is built and
# attached to a GitHub Release tagged v<version>. If that release already exists nothing happens,
# so bump "version" in package.json (and CHANGELOG.md) for every release.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Is this version already released?
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.exists.outputs.released == 'false'
        with:
          node-version: 22
          cache: npm
      - if: steps.exists.outputs.released == 'false'
        run: npm ci
      - if: steps.exists.outputs.released == 'false'
        run: npm test
      - if: steps.exists.outputs.released == 'false'
        run: npm run dist
      - if: steps.exists.outputs.released == 'false'
        run: npm run verify:package
      - if: steps.exists.outputs.released == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Wolfreader ${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: |
            release/Wolfreader-Setup-*.exe
            release/Wolfreader-Setup-*.exe.blockmap
